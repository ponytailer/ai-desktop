[project]
name = "ai-desktop"
version = "0.1.0"
description = "企业 AI Skill 共享与管理平台 (SkillHub)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alibabacloud-computenest20210601==4.5.2",
    "fastapi>=0.110.0",
    "ipython>=9.16.1",
    "jinja2>=3.1.3",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.9",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.25",
    "uvicorn[standard]>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"ai_desktop/__init__.py" = ["F401"]
"ai_desktop/routers/__init__.py" = ["F401"]
"ai_desktop/routers/*.py" = ["B008"]
"ai_desktop/seed.py" = ["E501"]
"ai_desktop/mock_data.py" = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_desktop"]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]

[project.scripts]
start = "ai_desktop.__main__:run"

